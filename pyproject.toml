[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econsim"
version = "0.1.0"
description = "Deterministic Monte Carlo simulator for game progression/economy loops"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
econsim = "econsim.cli:main"

[tool.setuptools]
packages = ["econsim"]
